name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security-audit:
    name: Keel Security Guard Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Keel Security Guard
        uses: sakhujarohan/keel-sec-guard@v1
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: 'gemini-3.6-flash'
          output-dir: '.keel/sec-guard'
          fail-on-severity: 'HIGH'
          ignore-rules: 'Elevated Permissions, Over-privileged, write permission, Unauthenticated Actor, Asserted Identity'
